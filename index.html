<style>

  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.8rem; margin: 0 0 24px; }
  .app { background: var(--card); border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; }
  .app h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .app p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
</style>

  <p>Support: <a href="mailto:maxste007@gmail.com">maxste007@gmail.com</a></p>

</html>
